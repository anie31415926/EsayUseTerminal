<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; worker-src 'self' blob:;" />
  <title>Spark Terminal</title>
  <link rel="icon" href="./icon.png" type="image/png" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/theme-neon.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <div class="drag-region">
        <span class="logo">⚡ Spark</span>
        <nav id="tabbar" class="drag-region"></nav>
        <button id="btn-new-tab" class="ghost-btn" title="新建标签 (Ctrl+Shift+T)">+</button>
      </div>
      <div class="window-controls no-drag">
        <button id="win-min" title="最小化">─</button>
        <button id="win-max" title="最大化">□</button>
        <button id="win-close" class="close" title="关闭">✕</button>
      </div>
    </header>

    <div id="workspace-bar">
      <span class="ws-label">工作区</span>
      <input type="text" spellcheck="false" placeholder="输入路径或浏览选择…" />
      <button data-act="browse" title="选择文件夹">📁</button>
      <button data-act="go" title="应用此路径作为新标签启动目录">✓</button>
    </div>

    <main id="terminal-host"></main>

    <footer id="statusbar">
      <span id="status-shell">—</span>
      <span class="spacer"></span>
      <span id="status-dim">0 x 0</span>
      <span id="status-zoom">100%</span>
      <button id="btn-settings" class="status-gear" title="设置（字号 / 主题）">⚙</button>
    </footer>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
