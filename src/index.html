<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; worker-src 'self' blob:;" />
  <title>Spark Terminal</title>
  <link rel="icon" href="./icon.png" type="image/png" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/theme-neon.css" />
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <div class="window-caption">
        <span class="logo">⚡ Spark</span>
        <div class="window-controls no-drag">
          <button id="win-min" title="最小化">─</button>
          <button id="win-max" title="最大化">□</button>
          <button id="win-close" class="close" title="关闭">✕</button>
        </div>
      </div>
      <div class="tab-toolbar">
        <div class="tab-strip">
          <nav id="tabbar" aria-label="终端标签"></nav>
        </div>
        <button id="btn-new-tab" class="ghost-btn" title="新建标签">+</button>
        <button id="btn-new-window" class="ghost-btn new-window-btn" title="新建窗口">新窗口</button>
      </div>
    </header>

    <div id="workspace-bar">
      <span class="ws-label">工作区</span>
      <input type="text" spellcheck="false" placeholder="默认：用户主目录" aria-label="工作区目录" aria-describedby="workspace-error" />
      <button data-act="browse" title="选择文件夹">📁</button>
      <button data-act="go" title="在此目录打开终端">✓</button>
      <span class="ws-sep"></span>
      <span class="ws-label">内容包</span>
      <select id="pack-select" title="选择一个注入内容包"></select>
      <button id="pack-launch" title="启动并发送选中的内容包">🚀</button>
    </div>

    <div id="workspace-error" role="alert" hidden></div>
    <main id="terminal-host"></main>

    <footer id="statusbar">
      <span id="status-shell">—</span>
      <span class="spacer"></span>
      <span id="status-dim">0 x 0</span>
      <span id="status-zoom">100%</span>
      <button id="btn-shortcuts" class="status-shortcuts" title="快捷键">快捷键</button>
      <button id="btn-settings" class="status-gear" title="设置（字号 / 主题）">⚙</button>
    </footer>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
