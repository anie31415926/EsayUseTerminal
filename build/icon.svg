<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Spark Terminal 应用图标（源文件）
    黑底科技风：深色渐变底板 + 中心霓虹光晕 + 顶部微光 + 内描边，闪电形状来自旧图标实测轮廓。
    改图标只需改这里，然后 `node scripts/make-icon.mjs` 重新生成 PNG / ICO。
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="0.52" stop-color="#080b10"/>
      <stop offset="1" stop-color="#020305"/>
    </linearGradient>

    <!-- 中心偏上的青柠光晕，给黑色底板一点「通电」感（别太大，否则黑底发绿） -->
    <radialGradient id="glow" cx="0.5" cy="0.40" r="0.55">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.17"/>
      <stop offset="0.5" stop-color="#65d9a5" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>

    <!-- 点阵纹理：只在中等以上尺寸看得出来，制造「电路板」质感 -->
    <pattern id="dots" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.4" fill="#a3e635" opacity="0.07"/>
    </pattern>

    <!-- 顶部冷光，模拟玻璃/金属受光 -->
    <linearGradient id="toplight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 底部压暗，让底板有厚度 -->
    <linearGradient id="vignette" x1="0" y1="0.55" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>

    <!-- 闪电本体：保留原来的青柠→薄荷渐变，提亮顶端 -->
    <linearGradient id="bolt" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#eeffc2"/>
      <stop offset="0.42" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#2dd4a7"/>
    </linearGradient>

    <filter id="halo" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <clipPath id="plateClip">
      <rect x="0" y="0" width="1024" height="1024" rx="230"/>
    </clipPath>
  </defs>

  <g clip-path="url(#plateClip)">
    <rect width="1024" height="1024" fill="url(#plate)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <rect width="1024" height="360" fill="url(#toplight)"/>
    <rect width="1024" height="1024" fill="url(#vignette)"/>
    <!-- 点阵压在所有明暗之上，保证四角亮度一致（否则暗部会把点吃掉，看着像脏玻璃） -->
    <rect width="1024" height="1024" fill="url(#dots)"/>

    <!-- 闪电外发光：同一路径先糊一层，压出霓虹边缘 -->
    <path d="M640.4 182.1 L382.5 557.7 L477.7 560.4 L400.4 842.0 L640.0 464.0 L557.3 464.0 Z"
          fill="#a3e635" opacity="0.5" filter="url(#halo)"/>
  </g>

  <!-- 闪电本体 -->
  <path d="M640.4 182.1 L382.5 557.7 L477.7 560.4 L400.4 842.0 L640.0 464.0 L557.3 464.0 Z"
        fill="url(#bolt)"/>

  <!-- 内描边：黑底上勾一圈极淡的高光，避免整块糊成一坨 -->
  <rect x="3" y="3" width="1018" height="1018" rx="228" fill="none"
        stroke="#ffffff" stroke-opacity="0.12" stroke-width="5"/>
</svg>
